name: Python Artifacts CI

on:
  push:
    branches:
      - python-app

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest > test_result.txt

      - name: Create build archive
        run: |
          zip -r build.zip todo_app tests requirements.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-app-artifacts
          path: |
            build.zip
            test_result.txt
